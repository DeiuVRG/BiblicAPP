name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint && pnpm lint:root

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm -r test

      # TODO(ci agent): pnpm audit --prod, Playwright smoke against the export, EXPO_PUBLIC secret check.
      - name: Export web
        run: pnpm --filter mobile export:web
