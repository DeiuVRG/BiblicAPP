name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository. Jobs that need more declare it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions (keep in sync with web-pages.yml, android-apk.yml and package.json).
  NODE_VERSION: 22.23.4
  PNPM_VERSION: 10.28.0
  EXPO_NO_TELEMETRY: '1'
  CI: 'true'

jobs:
  verify:
    name: Typecheck, lint, tests, web export, smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fails when an EXPO_PUBLIC_* value looks like a secret (those are shipped to every client).
      - name: Public env check
        run: node scripts/check-public-env.mjs --env

      - name: Script tests (env check, audit gate)
        run: node --test scripts/*.test.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint && pnpm lint:root

      - name: Format check
        run: pnpm format:check

      # Vitest in packages/*, Jest (jest-expo + React Native Testing Library) in apps/mobile.
      - name: Test
        run: pnpm -r test

      # Clearer failure than the Vitest check: the bundled pack must verify (sha256 + Ed25519).
      - name: Verify the bundled content pack
        run: pnpm --filter @biblioteca/content-tools cli verify-pack apps/mobile/assets/packs/vos-1903-kingdom-en

      - name: Export web
        run: pnpm --filter mobile export:web

      # Shipped font files: prints the TTF total, fails when the first-paint set grows past its budget.
      - name: Measure the shipped fonts
        run: node scripts/measure-fonts.mjs

      # The signed catalogue must match the installed packs (ADR-018).
      - name: Check the signed catalogue
        run: pnpm --filter @biblioteca/content-tools cli build-catalogue --check

      - name: Scan the export for secret-shaped tokens
        run: node scripts/check-public-env.mjs --env --dist apps/mobile/dist

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke against the export
        run: node scripts/smoke-web.mjs

      # The export must follow its theme in both colour schemes (docs/design-spec.md, section 1).
      - name: Playwright theme check against the export
        run: node scripts/check-web-theme.mjs

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # No `cache: pnpm` here: this job never installs, so the pnpm store does not exist and the
      # cache post-step would fail the job.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Equivalent of `pnpm audit --prod --audit-level=moderate`, except that it fails for
      # advisories that are not allow-listed with a reason and an expiry date
      # (scripts/audit-allowlist.json). Advisories without any published fix are only warnings
      # below high severity; at high and critical they block as well.
      - name: pnpm audit --prod (moderate and above)
        run: node scripts/audit-gate.mjs --audit-level moderate

      # Build tooling (@expo/cli, serve, Jest ...) executes in CI too: high and critical advisories
      # in the full dependency tree also block.
      - name: pnpm audit, all dependencies (high and above)
        run: node scripts/audit-gate.mjs --scope all --audit-level high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the whole history, not just the tip

      # The CLI is downloaded from the release page and verified against a pinned SHA-256, so no
      # third-party action runs in this job. To bump: update VERSION and SHA256 together (the
      # checksum is in gitleaks_<version>_checksums.txt of the release).
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the repository history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
