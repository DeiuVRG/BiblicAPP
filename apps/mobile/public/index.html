<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- The page follows the system scheme until the app applies the reader's own choice. -->
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Paper and ink (the `background` and `accent` of the light and dark palettes in
      src/theme/palettes.ts; a test keeps them equal), so that there is no white flash before
      JavaScript runs. <html> and <body> both read the variables, so whichever of them the browser
      paints shows the same colour. The app sets the variables again once it starts (the reader's
      own choice of theme), and the script below does it earlier for a theme chosen in Settings.
      The focus ring is the one place CSS has to know the accent colour.
    -->
    <style id="app-theme">
      :root {
        --app-background: #fbfaf7;
        --app-accent: #7a2e2a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --app-background: #141311;
          --app-accent: #e0a58b;
        }
      }
      html,
      body {
        background: var(--app-background);
      }
      /* One focus ring for the whole app, for keyboard focus only (not after a tap or a click). */
      :focus-visible {
        outline: 2px solid var(--app-accent);
        outline-offset: 2px;
      }
      /* A field's outline sits over its border, so the ring replaces the border instead of
         doubling it. */
      input:focus-visible,
      textarea:focus-visible {
        outline-offset: -1px;
      }
    </style>
    <script id="app-theme-stored">
      // A theme chosen in Settings wins over the system scheme: paint it before the app boots.
      (function () {
        try {
          var themes = {
            light: { background: '#fbfaf7', accent: '#7a2e2a' },
            sepia: { background: '#f4ecd8', accent: '#7a3e12' },
            dark: { background: '#141311', accent: '#e0a58b' },
          };
          var stored = JSON.parse(localStorage.getItem('biblioteca:settings:v1') || '{}').theme;
          if (!Object.prototype.hasOwnProperty.call(themes, stored)) return;
          var root = document.documentElement;
          root.style.setProperty('--app-background', themes[stored].background);
          root.style.setProperty('--app-accent', themes[stored].accent);
          root.style.colorScheme = stored === 'dark' ? 'dark' : 'light';
        } catch (error) {
          /* storage unavailable: keep the system scheme */
        }
      })();
    </script>
  </head>

  <body>
    <noscript> Pentru a folosi aplicația este necesar JavaScript. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
